{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Predict Occupancy</h2>
        <form method="post">
            {% for f in features %}
                <div class="mb-3">
                    <label class="form-label">{{ f.replace("_", " ") }}</label>
                    <input type="number" step="any" class="form-control" name="{{ f }}" required>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Predict</button>
        </form>
    </div>
</div>
{% endblock %}
